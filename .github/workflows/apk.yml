name: apk
on:
  push:
    branches: [apk-build]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew assembleDebug
        working-directory: submissions/kaimumutz/app
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: submissions/kaimumutz/app/app/build/outputs/apk/debug/app-debug.apk
